namespace: woo-platform

frontend:
  image: ghcr.io/gauravsehgal12/woo-frontend:v1.0.0
  imagePullPolicy: IfNotPresent
  replicas: 1

agent:
  image: ghcr.io/gauravsehgal12/woo-agent:v1.0.1
  imagePullPolicy: IfNotPresent
  replicas: 1

gateway:
  image: ghcr.io/gauravsehgal12/woo-gateway:v1.0.1
  imagePullPolicy: IfNotPresent
  replicas: 1
  dataClaim: gateway-data

registry:
  image: ghcr.io/gauravsehgal12/woo-gateway:v1.0.1
  imagePullPolicy: IfNotPresent
  replicas: 1
  dataClaim: gateway-data

wooMcp:
  image: ghcr.io/gauravsehgal12/woo-mcp-service:v1.0.0
  imagePullPolicy: IfNotPresent
  replicas: 1

gatewayDataPvc:
  create: true
  name: gateway-data
  size: 1Gi
  storageClass: local-path

ingress:
  enabled: true
  className: traefik
  dashboardHost: dashboard.example.com
  storeHost: store.example.com
