{{- if .Values.wooMcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  selector:
    matchLabels:
      app: woo-mcp-service
  template:
    metadata:
      labels:
        app: woo-mcp-service
    spec:
      containers:
        - name: woo-mcp-service
          image: {{ .Values.wooMcp.image | quote }}
          imagePullPolicy: {{ .Values.wooMcp.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.wooMcp.port }}
          env:
            - name: WOOCOMMERCE_URL
              value: {{ .Values.wooMcp.storeUrl | quote }}
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wooMcp.credentialsSecret }}
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.wooMcp.credentialsSecret }}
                  key: WOOCOMMERCE_CONSUMER_SECRET
            - name: PORT
              value: {{ .Values.wooMcp.port | quote }}
          resources:
            {{- toYaml .Values.resources.wooMcp | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: woo-mcp-service
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
