{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app: woo-gateway
  template:
    metadata:
      labels:
        app: woo-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image | quote }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          command: ["python", "server.py"]
          env:
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: GATEWAY_PORT
              value: {{ .Values.gateway.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          volumeMounts:
            - name: gateway-data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: {{ .Values.gateway.dataClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: woo-gateway
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: woo-gateway
  ports:
    - name: http
      port: 8100
      targetPort: http
{{- end }}
---
{{- if .Values.registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-registry-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.registry.replicas }}
  selector:
    matchLabels:
      app: woo-registry-api
  template:
    metadata:
      labels:
        app: woo-registry-api
    spec:
      containers:
        - name: registry-api
          image: {{ .Values.registry.image | quote }}
          imagePullPolicy: {{ .Values.registry.imagePullPolicy }}
          command:
            - uvicorn
            - registry_api:app
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.registry.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.registry.port }}
          volumeMounts:
            - name: gateway-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.registry | nindent 12 }}
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: {{ .Values.registry.dataClaim }}
---
apiVersion: v1
kind: Service
metadata:
  name: woo-registry-api
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: woo-registry-api
  ports:
    - name: http
      port: 8101
      targetPort: http
{{- end }}
