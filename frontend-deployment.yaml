
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-frontend
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-frontend
  template:
    metadata:
      labels:
        app: woo-frontend
    spec:
      containers:
        - name: frontend
          image: woo-frontend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: woo-frontend
  namespace: woo-platform
spec:
  type: ClusterIP
  selector:
    app: woo-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
