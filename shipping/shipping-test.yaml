apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-test
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-test
  template:
    metadata:
      labels:
        app: shipping-test
    spec:
      containers:
        - name: shipping-test
          image: shipping-test:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8300
          readinessProbe:
            tcpSocket:
              port: 8300
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipping-test
  namespace: woo-platform
spec:
  selector:
    app: shipping-test
  ports:
    - port: 8300
      targetPort: 8300
  type: ClusterIP