
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp-service
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp-service
  template:
    metadata:
      labels:
        app: woo-mcp-service
    spec:
      containers:
        - name: woo-mcp-service
          image: woo-mcp-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: WOOCOMMERCE_URL
              value: "http://woo-platform-wordpress"
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woocommerce-api-credentials
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woocommerce-api-credentials
                  key: WOOCOMMERCE_CONSUMER_SECRET
            - name: PORT
              value: "8000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp-service
  namespace: woo-platform
spec:
  type: ClusterIP
  selector:
    app: woo-mcp-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
