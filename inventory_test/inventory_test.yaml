
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-test
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-test
  template:
    metadata:
      labels:
        app: inventory-test
    spec:
      containers:
        - name: inventory-test
          image: inventory-test:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8200
          readinessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-test
  namespace: woo-platform
spec:
  selector:
    app: inventory-test
  ports:
    - name: http
      port: 8200
      targetPort: 8200
  type: ClusterIP
