---
# Source: woo-platform/templates/agent.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-agent
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-agent
  template:
    metadata:
      labels:
        app: woo-agent
    spec:
      containers:
        - name: woo-agent
          image: "woo-agent:v1.0.1"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8300
          envFrom:
            - secretRef:
                name: woo-agent-secrets
          env:
            - name: MCP_GATEWAY_URL
              value: "http://woo-gateway.woo-platform.svc.cluster.local:8100/mcp"
            - name: GROQ_MODEL
              value: "openai/gpt-oss-120b"
            - name: AGENT_MAX_STEPS
              value: "5"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20

---
# Source: woo-platform/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-frontend
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-frontend
  template:
    metadata:
      labels:
        app: woo-frontend
    spec:
      containers:
        - name: frontend
          image: "woo-frontend:v1.0.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi

---
# Source: woo-platform/templates/gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-gateway
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-gateway
  template:
    metadata:
      labels:
        app: woo-gateway
    spec:
      containers:
        - name: gateway
          image: "woo-gateway:v1.0.1"
          imagePullPolicy: IfNotPresent
          command: ["python", "server.py"]
          env:
            - name: GATEWAY_HOST
              value: "0.0.0.0"
            - name: GATEWAY_PORT
              value: "8100"
          ports:
            - name: http
              containerPort: 8100
          volumeMounts:
            - name: gateway-data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: gateway-data

---
# Source: woo-platform/templates/gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-registry-api
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-registry-api
  template:
    metadata:
      labels:
        app: woo-registry-api
    spec:
      containers:
        - name: registry-api
          image: "woo-gateway:v1.0.1"
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - registry_api:app
            - --host
            - 0.0.0.0
            - --port
            - "8101"
          ports:
            - name: http
              containerPort: 8101
          volumeMounts:
            - name: gateway-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: gateway-data
          persistentVolumeClaim:
            claimName: gateway-data

---
# Source: woo-platform/templates/woo-mcp-service.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp-service
  namespace: woo-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp-service
  template:
    metadata:
      labels:
        app: woo-mcp-service
    spec:
      containers:
        - name: woo-mcp-service
          image: "woo-mcp-service:local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: WOOCOMMERCE_URL
              value: "http://woo-platform-wordpress"
            - name: WOOCOMMERCE_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woocommerce-api-credentials
                  key: WOOCOMMERCE_CONSUMER_KEY
            - name: WOOCOMMERCE_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woocommerce-api-credentials
                  key: WOOCOMMERCE_CONSUMER_SECRET
            - name: PORT
              value: "8000"
          
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
